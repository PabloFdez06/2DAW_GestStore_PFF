<app-sidebar-layout activeRoute="/tareas">
  <!-- Header slot -->
  <nav slot="header" class="tasks-page__nav" role="navigation" aria-label="Navegación principal">
    <h1 class="tasks-page__logo">
      <span class="tasks-page__logo-gest">Gest</span><span class="tasks-page__logo-store">Store</span>
    </h1>

    <search class="tasks-page__search" role="search">
      <input 
        type="search" 
        class="tasks-page__search-input" 
        placeholder="Busca tu tarea aqui..."
        [(ngModel)]="search"
        (input)="onSearchChange()"
        aria-label="Buscar tareas"
      />
      <button class="tasks-page__search-btn" type="button" aria-label="Buscar">
        <app-icon name="search" size="small"></app-icon>
      </button>
    </search>

    <section class="tasks-page__nav-actions" aria-label="Acciones rápidas">
      <button 
        class="tasks-page__nav-btn" 
        [class.tasks-page__nav-btn--has-alerts]="stockAlertService.hasAlerts()"
        type="button" 
        (click)="toggleStockNotifications()"
        aria-label="Notificaciones de stock">
        <app-icon name="bell" size="small"></app-icon>
        <span class="tasks-page__notification-badge" *ngIf="stockAlertService.alertsCount() > 0">{{ stockAlertService.alertsCount() }}</span>
      </button>
      <button
        class="tasks-page__nav-btn"
        type="button"
        (click)="toggleTheme()"
        (keydown.enter)="toggleTheme(); $event.preventDefault()"
        [attr.aria-label]="themeAriaLabel">
        <app-icon [name]="themeIcon" size="small"></app-icon>
      </button>
      <button class="tasks-page__nav-btn" type="button" (click)="toggleCalendar()" aria-label="Calendario">
        <app-icon name="calendar" size="small"></app-icon>
      </button>
      <time class="tasks-page__date" [attr.dateTime]="currentDate">
        <p class="tasks-page__date-day">{{ currentDayName }}</p>
        <p class="tasks-page__date-full">{{ currentDate }}</p>
      </time>
    </section>
  </nav>

  <!-- Stock Notifications Modal -->
  <app-stock-notifications 
    *ngIf="isStockNotificationsOpen" 
    (close)="closeStockNotifications()">
  </app-stock-notifications>

  <!-- Calendar Modal Overlay -->
  <dialog
    #calendarDialog
    *ngIf="isCalendarOpen"
    class="tasks-page__modal-overlay"
    (click)="closeCalendar()"
    open
    role="dialog"
    aria-modal="true"
    aria-label="Calendario">
    <section class="tasks-page__modal-content" (click)="$event.stopPropagation()">
      <app-calendar (close)="closeCalendar()"></app-calendar>
    </section>
  </dialog>

  <!-- Add Task Modal Overlay -->
  <dialog
    #taskDialog
    *ngIf="isTaskModalOpen"
    class="tasks-page__modal-overlay"
    (click)="closeTaskModal()"
    open
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="isEditMode ? 'Editar tarea' : 'Añadir tarea'">
    <section class="tasks-page__modal-content" (click)="$event.stopPropagation()">
      <app-add-task-modal 
        [task]="taskToEdit"
        [isEditMode]="isEditMode"
        (close)="closeTaskModal()" 
        (taskAdded)="handleTaskAdded($event)"
        (taskUpdated)="handleTaskUpdated($event)">
      </app-add-task-modal>
    </section>
  </dialog>

  <!-- Main Content -->
  <article class="tasks-page__content">
    <!-- Tasks Section -->
    <section class="tasks-page__section" aria-labelledby="tasks-title">
      <header class="tasks-page__section-header">
        <hgroup class="tasks-page__section-title-wrap">
          <app-icon name="clipboard" size="small" class="tasks-page__section-icon"></app-icon>
          <h2 id="tasks-title" class="tasks-page__section-title">To-Do</h2>
        </hgroup>
        <app-button 
          variant="link" 
          icon="plus" 
          ariaLabel="Añadir tarea"
          (clicked)="openAddTaskModal()">
          Añadir Tarea
        </app-button>
      </header>

      <header class="tasks-page__section-subheader">
        <time class="tasks-page__section-date" [attr.dateTime]="currentDate">{{ currentDate }}</time>
        <span class="tasks-page__separator" aria-hidden="true">•</span>
        <mark class="tasks-page__section-today">Hoy</mark>
      </header>

      <!-- Loading state -->
      <output *ngIf="isLoading" class="tasks-page__loading" role="status" aria-live="polite">
        <app-spinner size="medium"></app-spinner>
        <p>Cargando tareas...</p>
      </output>

      <!-- Error state -->
      <aside *ngIf="!isLoading && errorMessage" class="tasks-page__error" role="alert">
        <p>{{ errorMessage }}</p>
        <app-button variant="primary" size="small" (clicked)="loadTasks()">Reintentar</app-button>
      </aside>

      <!-- Empty state -->
      <section *ngIf="!isLoading && !errorMessage && filteredTasks.length === 0" class="tasks-page__empty-state">
        <app-icon name="inbox" size="large" class="tasks-page__empty-icon"></app-icon>
        <p class="tasks-page__empty-text">No hay tareas que coincidan con la búsqueda</p>
        <app-button variant="primary" icon="plus" (clicked)="openAddTaskModal()">Crear tarea</app-button>
      </section>

      <!-- Tasks grid -->
      <ul *ngIf="!isLoading && !errorMessage && filteredTasks.length > 0" class="tasks-page__grid" role="list">
        <li *ngFor="let task of filteredTasks; let i = index" role="listitem">
          <app-task-card
            [title]="task.title"
            [description]="task.description"
            [status]="task.status"
            [priority]="task.priority"
            [imageUrl]="task.imageUrl"
            [important]="task.important || false"
            [createdAt]="task.createdAt"
            [showMenu]="true"
            [isMenuOpen]="openTaskMenuIndex === i"
            (cardClick)="goToTask(task)"
            (menuToggle)="toggleTaskMenu(i, $event)">
            <app-task-menu 
              slot="menu"
              [isImportant]="task.important || false" 
              [status]="task.status" 
              (action)="handleTaskAction($event, i)">
            </app-task-menu>
          </app-task-card>
        </li>
      </ul>
    </section>
  </article>
</app-sidebar-layout>
