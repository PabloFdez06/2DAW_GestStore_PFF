<app-sidebar-layout activeRoute="/tareas">
  <!-- Header slot -->
  <app-nav-header
    slot="header"
    searchPlaceholder="Busca tu tarea aqui..."
    searchAriaLabel="Buscar tareas"
    [searchValue]="search"
    (searchValueChange)="search = $event; onSearchChange()"
    (notificationsToggle)="toggleStockNotifications()"
    (calendarToggle)="toggleCalendar()">
  </app-nav-header>

  <!-- Stock Notifications Modal -->
  <app-stock-notifications 
    *ngIf="isStockNotificationsOpen" 
    (close)="closeStockNotifications()">
  </app-stock-notifications>

  <!-- Calendar Modal Overlay -->
  <app-modal-wrapper 
    [isOpen]="isCalendarOpen" 
    ariaLabel="Calendario"
    (close)="closeCalendar()">
    <app-calendar (close)="closeCalendar()"></app-calendar>
  </app-modal-wrapper>

  <!-- Add Task Modal Overlay -->
  <app-modal-wrapper 
    [isOpen]="isTaskModalOpen" 
    [ariaLabel]="isEditMode ? 'Editar tarea' : 'Añadir tarea'"
    (close)="closeTaskModal()">
    <app-add-task-modal 
      [task]="taskToEdit"
      [isEditMode]="isEditMode"
      (close)="closeTaskModal()" 
      (taskAdded)="handleTaskAdded($event)"
      (taskUpdated)="handleTaskUpdated($event)">
    </app-add-task-modal>
  </app-modal-wrapper>

  <!-- Main Content -->
  <article class="tasks-page__content">
    <!-- Tasks Section -->
    <section class="tasks-page__section" aria-labelledby="tasks-title">
      <header class="tasks-page__section-header">
        <hgroup class="tasks-page__section-title-wrap">
          <app-icon name="clipboard" size="small" class="tasks-page__section-icon"></app-icon>
          <h2 id="tasks-title" class="tasks-page__section-title">To-Do</h2>
        </hgroup>
        <app-button 
          variant="link" 
          icon="plus" 
          ariaLabel="Añadir tarea"
          (clicked)="openAddTaskModal()">
          Añadir Tarea
        </app-button>
      </header>

      <header class="tasks-page__section-subheader">
        <time class="tasks-page__section-date" [attr.dateTime]="currentDate">{{ currentDate }}</time>
        <span class="tasks-page__separator" aria-hidden="true">•</span>
        <mark class="tasks-page__section-today">Hoy</mark>
      </header>

      <!-- Loading state -->
      <app-loading-state 
        *ngIf="isLoading" 
        message="Cargando tareas...">
      </app-loading-state>

      <!-- Error state -->
      <app-error-state 
        *ngIf="!isLoading && errorMessage" 
        [message]="errorMessage"
        (retry)="loadTasks()">
      </app-error-state>

      <!-- Empty state -->
      <app-empty-state 
        *ngIf="!isLoading && !errorMessage && filteredTasks.length === 0"
        icon="inbox"
        message="No hay tareas que coincidan con la búsqueda"
        buttonText="Crear tarea"
        buttonIcon="plus"
        (buttonClick)="openAddTaskModal()">
      </app-empty-state>

      <!-- Tasks grid -->
      <ul *ngIf="!isLoading && !errorMessage && filteredTasks.length > 0" class="tasks-page__grid" role="list">
        <li *ngFor="let task of filteredTasks; let i = index; trackBy: trackByTaskId" role="listitem">
          <app-task-card
            [title]="task.title"
            [description]="task.description"
            [status]="task.status"
            [priority]="task.priority"
            [imageUrl]="task.imageUrl"
            [important]="task.important || false"
            [createdAt]="task.createdAt"
            [showMenu]="true"
            [isMenuOpen]="openTaskMenuIndex === i"
            (cardClick)="goToTask(task)"
            (menuToggle)="toggleTaskMenu(i, $event)">
            <app-task-menu 
              slot="menu"
              [isImportant]="task.important || false" 
              [status]="task.status" 
              (action)="handleTaskAction($event, i)">
            </app-task-menu>
          </app-task-card>
        </li>
      </ul>
    </section>
  </article>
</app-sidebar-layout>
