<app-sidebar-layout activeRoute="/perfil">
  <!-- Header slot -->
  <nav slot="header" class="profile__topbar" role="navigation" aria-label="Navegación principal">
    <h1 class="profile__logo">
      <span class="profile__logo-gest">Gest</span><span class="profile__logo-store">Store</span>
    </h1>

    <section class="profile__topbar-content" aria-label="Fecha y acciones">
      <hgroup class="profile__date-group">
        <p class="profile__day">{{ currentDayName }}</p>
        <p class="profile__full-date">{{ currentDate }}</p>
      </hgroup>

      <button class="profile__icon-button" type="button" (click)="toggleTheme()" [attr.aria-label]="themeAriaLabel">
        <app-icon [name]="themeIcon"></app-icon>
      </button>
    </section>
  </nav>

  <!-- Main Content -->
  <article class="profile__content" aria-label="Contenido">
    <section class="profile__card" aria-label="Información de tu cuenta">
      <header class="profile__card-header">
        <a class="profile__back" href="#" (click)="onBack($event)">
          <app-icon name="chevron-left"></app-icon>
          <span>Volver</span>
        </a>

        <h2 class="profile__card-title">Información de tu Cuenta</h2>

        <section class="profile__identity" aria-label="Identidad">
          <ng-container *ngIf="avatarUrl; else profileIdentityAvatarDefault">
            <img class="profile__identity-avatar" [src]="avatarUrl" alt="Avatar" loading="lazy" decoding="async" />
          </ng-container>
          <ng-template #profileIdentityAvatarDefault>
            <span class="profile__identity-avatar profile__identity-avatar--empty" aria-hidden="true">
              <app-icon name="user" size="large"></app-icon>
            </span>
          </ng-template>

          <section class="profile__identity-text" aria-label="Nombre y correo">
            <p class="profile__identity-name">{{ name || currentUser?.name || 'Usuario' }} {{ lastName }}</p>
            <p class="profile__identity-email">{{ email || currentUser?.email || '' }}</p>
          </section>

          <label class="profile__upload" aria-label="Subir avatar">
            <input class="profile__upload-input" type="file" accept="image/png,image/jpeg,image/svg+xml" (change)="onAvatarSelected($event)" />
            <span class="profile__upload-pill">
              <app-icon name="upload"></app-icon>
              <span>Subir</span>
            </span>
            <small class="profile__upload-hint">Máx. 2MB · SVG, JPG, PNG</small>
          </label>
        </section>
      </header>

      <form class="profile__form" (submit)="onUpdateInfo($event)" aria-label="Formulario de perfil">
        <fieldset class="profile__fieldset">
          <legend class="profile__legend">Datos personales</legend>

          <label class="profile__field" aria-label="Nombre">
            <span class="profile__label">Nombre</span>
            <input class="profile__input" type="text" name="name" [(ngModel)]="name" required />
          </label>

          <label class="profile__field" aria-label="Apellidos">
            <span class="profile__label">Apellidos</span>
            <input class="profile__input" type="text" name="lastName" [(ngModel)]="lastName" />
          </label>

          <label class="profile__field" aria-label="Correo electrónico">
            <span class="profile__label">Correo Electrónico</span>
            <input class="profile__input" type="email" name="email" [(ngModel)]="email" required />
          </label>

          <label class="profile__field" aria-label="Número de teléfono">
            <span class="profile__label">Número de Teléfono</span>
            <input class="profile__input" type="tel" name="phone" [(ngModel)]="phone" />
          </label>

          <label class="profile__field" aria-label="Dirección">
            <span class="profile__label">Dirección</span>
            <input class="profile__input" type="text" name="address" [(ngModel)]="address" />
          </label>
        </fieldset>

        <p class="profile__success" *ngIf="successMessage">{{ successMessage }}</p>
        <p class="profile__error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <section class="profile__actions" aria-label="Acciones">
          <app-button variant="primary" type="submit" [disabled]="isSaving">
            <app-spinner *ngIf="isSaving" size="small"></app-spinner>
            <span *ngIf="!isSaving">Actualizar Info</span>
            <span *ngIf="isSaving">Guardando…</span>
          </app-button>

          <app-button variant="secondary" (clicked)="onGoToPassword($event)">
            Cambiar Contraseña
          </app-button>
        </section>
      </form>
    </section>
  </article>
</app-sidebar-layout>
