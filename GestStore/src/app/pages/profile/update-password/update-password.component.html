<main class="password">
  <!-- Botón hamburguesa para mobile -->
  <button 
    class="password__hamburger" 
    type="button"
    (click)="toggleSidebar()"
    [attr.aria-label]="isSidebarOpen ? 'Cerrar menú' : 'Abrir menú'"
    [attr.aria-expanded]="isSidebarOpen"
    [class.is-open]="isSidebarOpen">
    <span class="password__hamburger-line password__hamburger-line--top" aria-hidden="true"></span>
    <span class="password__hamburger-line password__hamburger-line--middle" aria-hidden="true"></span>
    <span class="password__hamburger-line password__hamburger-line--bottom" aria-hidden="true"></span>
  </button>

  <!-- Overlay del sidebar para mobile -->
  <span 
    *ngIf="isSidebarOpen" 
    class="password__sidebar-overlay"
    role="presentation"
    (click)="closeSidebar()"
    aria-hidden="true"></span>

  <aside class="password__sidebar" [class.is-open]="isSidebarOpen" aria-label="Menú lateral">
    <header class="password__sidebar-header">
      <a class="password__brand" routerLink="/dashboard" aria-label="GestStore">
        <app-icon name="check-circle" size="large"></app-icon>
        <span class="password__brand-text">GestStore</span>
      </a>
    </header>

    <nav class="password__nav" aria-label="Navegación principal">
      <ul class="password__nav-list">
        <li class="password__nav-item">
          <a class="password__nav-link" routerLink="/dashboard">
            <app-icon name="home"></app-icon>
            <span>Inicio</span>
          </a>
        </li>

        <li class="password__nav-item">
          <a class="password__nav-link" routerLink="/tareas">
            <app-icon name="check-square"></app-icon>
            <span>Tareas</span>
          </a>
        </li>

        <li class="password__nav-item">
          <a class="password__nav-link" routerLink="/tareas-importantes">
            <app-icon name="star"></app-icon>
            <span>Importantes</span>
          </a>
        </li>

        <li class="password__nav-item">
          <a class="password__nav-link" routerLink="/ajustes">
            <app-icon name="settings"></app-icon>
            <span>Ajustes</span>
          </a>
        </li>
      </ul>
    </nav>

    <footer class="password__sidebar-footer">
      <a class="password__user" routerLink="/perfil" aria-label="Ir a tu perfil">
        <ng-container *ngIf="avatarUrl; else passwordSidebarAvatarDefault">
          <img class="password__user-avatar" [src]="avatarUrl" alt="Avatar" loading="lazy" decoding="async" />
        </ng-container>
        <ng-template #passwordSidebarAvatarDefault>
          <span class="password__user-avatar password__user-avatar--empty" aria-hidden="true">
            <app-icon name="user" size="large"></app-icon>
          </span>
        </ng-template>
        <span class="password__user-name">{{ currentUser?.name || 'Usuario' }}</span>
      </a>
    </footer>
  </aside>

  <section class="password__content" aria-label="Contenido">
    <header class="password__topbar">
      <section class="password__topbar-left" aria-label="Fecha">
        <h1 class="password__title">Actualizar contraseña</h1>
        <p class="password__subtitle">{{ currentDayName }}, {{ currentDate }}</p>
      </section>

      <section class="password__topbar-right" aria-label="Acciones">
        <button class="password__icon-button" type="button" (click)="toggleTheme()" [attr.aria-label]="themeAriaLabel">
          <app-icon [name]="themeIcon"></app-icon>
        </button>
      </section>
    </header>

    <section class="password__card" aria-label="Actualizar contraseña">
      <header class="password__card-header">
        <a class="password__back" href="#" (click)="onBack($event)">
          <app-icon name="chevron-left"></app-icon>
          <span>Volver</span>
        </a>

        <h2 class="password__card-title">Actualiza tu contraseña</h2>
      </header>

      <form class="password__form" (submit)="onUpdatePassword($event)" aria-label="Formulario de contraseña">
        <fieldset class="password__fieldset">
          <legend class="password__legend">Seguridad</legend>

          <label class="password__field" aria-label="Contraseña actual">
            <span class="password__label">Contraseña Actual</span>
            <input class="password__input" type="password" name="currentPassword" [(ngModel)]="currentPassword" autocomplete="current-password" />
          </label>

          <label class="password__field" aria-label="Nueva contraseña">
            <span class="password__label">Nueva Contraseña</span>
            <input class="password__input" type="password" name="newPassword" [(ngModel)]="newPassword" autocomplete="new-password" />
          </label>

          <label class="password__field" aria-label="Confirmar contraseña">
            <span class="password__label">Confirmar Contraseña</span>
            <input class="password__input" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" autocomplete="new-password" />
          </label>
        </fieldset>

        <p class="password__success" *ngIf="successMessage">{{ successMessage }}</p>
        <p class="password__error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <section class="password__actions" aria-label="Acciones">
          <button class="password__primary" type="submit" [disabled]="isSaving">
            {{ isSaving ? 'Actualizando…' : 'Actualizar Contraseña' }}
          </button>

          <button class="password__secondary" type="button" (click)="onCancel($event)">
            Cancelar
          </button>
        </section>
      </form>
    </section>
  </section>
</main>
