<app-sidebar-layout activeRoute="/perfil">
  <!-- Header slot -->
  <nav slot="header" class="password__topbar" role="navigation" aria-label="Navegación principal">
    <h1 class="password__logo">
      <span class="password__logo-gest">Gest</span><span class="password__logo-store">Store</span>
    </h1>

    <section class="password__topbar-content" aria-label="Fecha y acciones">
      <hgroup class="password__date-group">
        <p class="password__day">{{ currentDayName }}</p>
        <p class="password__full-date">{{ currentDate }}</p>
      </hgroup>

      <button class="password__icon-button" type="button" (click)="toggleTheme()" [attr.aria-label]="themeAriaLabel">
        <app-icon [name]="themeIcon"></app-icon>
      </button>
    </section>
  </nav>

  <!-- Main Content -->
  <article class="password__content" aria-label="Contenido">
    <section class="password__card" aria-label="Actualizar contraseña">
      <header class="password__card-header">
        <a class="password__back" href="#" (click)="onBack($event)">
          <app-icon name="chevron-left"></app-icon>
          <span>Volver</span>
        </a>

        <h2 class="password__card-title">Actualiza tu contraseña</h2>
      </header>

      <form class="password__form" (submit)="onUpdatePassword($event)" aria-label="Formulario de contraseña">
        <fieldset class="password__fieldset">
          <legend class="password__legend">Seguridad</legend>

          <label class="password__field" aria-label="Contraseña actual">
            <span class="password__label">Contraseña Actual</span>
            <input class="password__input" type="password" name="currentPassword" [(ngModel)]="currentPassword" autocomplete="current-password" />
          </label>

          <label class="password__field" aria-label="Nueva contraseña">
            <span class="password__label">Nueva Contraseña</span>
            <input class="password__input" type="password" name="newPassword" [(ngModel)]="newPassword" autocomplete="new-password" />
          </label>

          <label class="password__field" aria-label="Confirmar contraseña">
            <span class="password__label">Confirmar Contraseña</span>
            <input class="password__input" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" autocomplete="new-password" />
          </label>
        </fieldset>

        <p class="password__success" *ngIf="successMessage">{{ successMessage }}</p>
        <p class="password__error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <section class="password__actions" aria-label="Acciones">
          <app-button variant="primary" type="submit" [disabled]="isSaving">
            {{ isSaving ? 'Actualizando…' : 'Actualizar Contraseña' }}
          </app-button>

          <app-button variant="secondary" (clicked)="onCancel($event)">
            Cancelar
          </app-button>
        </section>
      </form>
    </section>
  </article>
</app-sidebar-layout>
