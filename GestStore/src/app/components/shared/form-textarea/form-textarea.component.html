<label class="form-group">
  <span class="form-label" *ngIf="label">
    {{ label }}
    <abbr class="required" *ngIf="required" title="Campo requerido" aria-hidden="true">*</abbr>
    <span class="visually-hidden" *ngIf="required">(campo requerido)</span>
  </span>
  
  <textarea
    #textareaEl
    [id]="id"
    [name]="name"
    [placeholder]="placeholder"
    [required]="required"
    [disabled]="disabled"
    [value]="value"
    [rows]="rows"
    [class.form-textarea--error]="error"
    [attr.aria-invalid]="error ? 'true' : null"
    [attr.aria-describedby]="getAriaDescribedBy()"
    class="form-textarea"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (keyup)="onKeyup($event)"
  ></textarea>

  <small class="form-help" [id]="id + '-help'" *ngIf="helpText">{{ helpText }}</small>
  <output class="form-error" [id]="id + '-error'" *ngIf="error" role="alert">{{ error }}</output>
</label>
