<article class="register-container">
  <button class="register-container__back" type="button" aria-label="Volver" (click)="onBack()">
    ← Volver
  </button>
  
  <section class="register-content">
    <figure class="register-content__illustration fade-in-left">
      <picture>
        <source
          type="image/png"
          srcset="/register-illustration.png 600w, /register-illustration.png 1200w"
          sizes="(max-width: 768px) 100vw, 600px"
        />
        <img
          src="/register-illustration.png"
          alt="Ilustración de registro"
          class="register-illustration-img"
          loading="lazy"
          decoding="async"
          width="600"
          height="500"
        />
      </picture>
    </figure>

    <article class="register-content__form-section">
        <h2 class="register-modal__title">Registrarme</h2>
        
        <form class="register-modal__form" (ngSubmit)="onSubmit($event)">
          <fieldset>
            <legend class="visually-hidden">Datos de registro</legend>
            
            <label class="form-group">
              <input type="text" 
                     id="name"
                     class="form-input form-input--with-icon" 
                     placeholder="Introduce el nombre"
                     [(ngModel)]="name"
                     name="name"
                     autocomplete="given-name"
                     [class.form-input--error]="errors['name']">
              <svg class="form-input__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
              </svg>
              @if (errors['name']) {
                <output class="form-error" role="alert">{{ errors['name'] }}</output>
              }
            </label>

            <label class="form-group">
              <input type="text" 
                     id="lastName"
                     class="form-input form-input--with-icon" 
                     placeholder="Introduce el apellido"
                     [(ngModel)]="lastName"
                     name="lastName"
                     autocomplete="family-name"
                     [class.form-input--error]="errors['lastName']">
              <svg class="form-input__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
              </svg>
              @if (errors['lastName']) {
                <output class="form-error" role="alert">{{ errors['lastName'] }}</output>
              }
            </label>

            <label class="form-group">
              <input type="email" 
                     id="email"
                     class="form-input form-input--with-icon" 
                     placeholder="Introduce el email"
                     [(ngModel)]="email"
                     name="email"
                     autocomplete="email"
                     [class.form-input--error]="errors['email']">
              <svg class="form-input__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              @if (errors['email']) {
                <output class="form-error" role="alert">{{ errors['email'] }}</output>
              }
            </label>

            <label class="form-group">
              <input type="tel" 
                     id="phone"
                     class="form-input form-input--with-icon" 
                     placeholder="Número de teléfono"
                     [(ngModel)]="phone"
                     name="phone"
                     autocomplete="tel"
                     [class.form-input--error]="errors['phone']">
              <svg class="form-input__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.86 19.86 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.12.86.3 1.7.54 2.5a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.58-1.06a2 2 0 0 1 2.11-.45c.8.24 1.64.42 2.5.54A2 2 0 0 1 22 16.92z"/>
              </svg>
              @if (errors['phone']) {
                <output class="form-error" role="alert">{{ errors['phone'] }}</output>
              }
            </label>

            <label class="form-group">
              <input type="text" 
                     id="address"
                     class="form-input form-input--with-icon" 
                     placeholder="Dirección"
                     [(ngModel)]="address"
                     name="address"
                     autocomplete="street-address"
                     [class.form-input--error]="errors['address']">
              <svg class="form-input__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
              @if (errors['address']) {
                <output class="form-error" role="alert">{{ errors['address'] }}</output>
              }
            </label>

            <label class="form-group">
              <input type="password" 
                     id="password"
                     class="form-input form-input--with-icon" 
                     placeholder="Contraseña"
                     [(ngModel)]="password"
                     name="password"
                     autocomplete="new-password"
                     [class.form-input--error]="errors['password']">
              <svg class="form-input__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              @if (errors['password']) {
                <output class="form-error" role="alert">{{ errors['password'] }}</output>
              }
            </label>

            <label class="form-group">
              <input type="password" 
                     id="confirmPassword"
                     class="form-input form-input--with-icon" 
                     placeholder="Confirmar contraseña"
                     [(ngModel)]="confirmPassword"
                     name="confirmPassword"
                     autocomplete="new-password"
                     [class.form-input--error]="errors['confirmPassword']">
              <svg class="form-input__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              @if (errors['confirmPassword']) {
                <output class="form-error" role="alert">{{ errors['confirmPassword'] }}</output>
              }
            </label>

            <label class="form-checkbox">
              <input type="checkbox" 
                     id="agree-terms" 
                     [(ngModel)]="agreeTerms"
                     name="agreeTerms"
                     class="form-checkbox__input">
              <span class="form-checkbox__label">De acuerdo con las condiciones</span>
            </label>

            <button type="submit" class="button button--primary">Register</button>
          </fieldset>
        </form>

        <p class="register-modal__login-link">¿Tienes ya una cuenta? <a routerLink="/login" class="link-primary">Log In</a></p>
      </article>
    </section>
</article>
