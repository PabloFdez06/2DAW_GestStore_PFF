<label class="form-label" [attr.for]="id" *ngIf="label">
  {{ label }}
  <abbr class="required" *ngIf="required" title="Campo requerido" aria-hidden="true">*</abbr>
  <span class="visually-hidden" *ngIf="required">(campo requerido)</span>
</label>

<input
  #inputEl
  [id]="id"
  [name]="name"
  [type]="type"
  [placeholder]="placeholder"
  [required]="required"
  [disabled]="disabled"
  [value]="value"
  [class.form-input--error]="error"
  [attr.aria-invalid]="error ? 'true' : null"
  [attr.aria-describedby]="getAriaDescribedBy()"
  class="form-input"
  (input)="onInput($event)"
  (focus)="onFocus()"
  (blur)="onBlur()"
  (keyup)="onKeyup($event)"
/>

<small class="form-help" [id]="id + '-help'" *ngIf="helpText">{{ helpText }}</small>
<output class="form-error" [id]="id + '-error'" *ngIf="error" role="alert">{{ error }}</output>
