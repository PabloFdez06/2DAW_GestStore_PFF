<menu class="task-menu" role="menu" aria-label="Acciones de tarea">
  <li role="menuitem">
    <button class="task-menu__item" type="button" (click)="onToggleImportant()">
      {{ isImportant ? 'Quitar de importante' : 'Marcar como importante' }}
    </button>
  </li>
  <li role="menuitem">
    <button class="task-menu__item" type="button" (click)="onEdit()">
      Editar
    </button>
  </li>
  <li role="menuitem">
    <button class="task-menu__item" type="button" (click)="onDelete()">
      Eliminar
    </button>
  </li>
  <li role="menuitem">
    <button class="task-menu__item" type="button" (click)="onComplete()">
      Completar
    </button>
  </li>
</menu>
