<article class="calendar" role="application" aria-label="Calendario">
  <!-- Header -->
  <header class="calendar__header">
    <h3 class="calendar__title">{{ monthName }}, {{ year }}</h3>
    <nav class="calendar__nav" aria-label="Navegación del calendario">
      <button class="calendar__nav-btn" type="button" (click)="previousMonth()" aria-label="Mes anterior">
        <app-icon name="chevron-left" size="small"></app-icon>
      </button>
      <button class="calendar__nav-btn" type="button" (click)="nextMonth()" aria-label="Mes siguiente">
        <app-icon name="chevron-right" size="small"></app-icon>
      </button>
    </nav>
  </header>

  <!-- Week Days -->
  <ul class="calendar__weekdays" role="list" aria-label="Días de la semana">
    <li 
      *ngFor="let day of weekDays" 
      class="calendar__weekday"
      [class.calendar__weekday--active]="day === getCurrentDayOfWeek()"
      role="listitem">
      {{ day }}
    </li>
  </ul>

  <!-- Days Grid -->
  <section class="calendar__days" role="grid" aria-label="Días del mes">
    <button
      *ngFor="let calendarDay of calendarDays"
      class="calendar__day"
      type="button"
      role="gridcell"
      [class.calendar__day--other-month]="!calendarDay.isCurrentMonth"
      [class.calendar__day--selected]="calendarDay.isSelected"
      [class.calendar__day--today]="calendarDay.isToday"
      [class.calendar__day--has-tasks]="calendarDay.hasTasks"
      [attr.aria-selected]="calendarDay.isSelected"
      [attr.aria-current]="calendarDay.isToday ? 'date' : null"
      (click)="selectDay(calendarDay)">
      <span class="calendar__day-number">{{ calendarDay.day }}</span>
      <span class="calendar__day-indicator" *ngIf="calendarDay.hasTasks" aria-label="Tiene tareas"></span>
    </button>
  </section>

  <!-- Selected Info -->
  <output class="calendar__selected-info" *ngIf="selectedDate" role="status" aria-live="polite">
    <span class="calendar__selected-date">
      {{ selectedDate.getDate() }} de {{ monthName }}, {{ getSelectedDayOfWeek() }}
    </span>
    <span class="calendar__task-count" [class.calendar__task-count--has-tasks]="selectedTaskCount > 0">
      {{ selectedTaskCount }} {{ selectedTaskCount === 1 ? 'tarea' : 'tareas' }}
    </span>
  </output>

  <!-- Actions -->
  <footer class="calendar__actions calendar__actions--center">
    <button class="calendar__btn calendar__btn--primary" type="button" (click)="onClose()">
      Cerrar
    </button>
  </footer>
</article>
