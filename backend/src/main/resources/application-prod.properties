# Production Profile
spring.config.activate.on-profile=prod

# MongoDB - Variables desde Docker Compose o Koyeb
# IMPORTANTE: La URI debe incluir el nombre de la base de datos
# Formato: mongodb+srv://user:pass@cluster.mongodb.net/DATABASE?retryWrites=true&w=majority
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/geststore}
spring.data.mongodb.database=${MONGODB_DATABASE:geststore}

# Desactivar auto-creación de índices para evitar conflictos
spring.data.mongodb.auto-index-creation=false

# Logging - Menos verbose en producción
logging.level.root=WARN
logging.level.com.geststore=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.mongodb.driver=WARN

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
