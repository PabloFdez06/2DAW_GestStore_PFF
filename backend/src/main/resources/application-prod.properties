# Production Profile
spring.config.activate.on-profile=prod

# MongoDB - Variables desde Docker Compose
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://geststore:geststore123@db:27017/geststore_dev?authSource=admin}
# Desactivar auto-creación de índices para evitar conflictos
spring.data.mongodb.auto-index-creation=false

# Logging - Menos verbose en producción
logging.level.root=WARN
logging.level.com.geststore=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.data.mongodb=WARN

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
