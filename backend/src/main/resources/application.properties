# GestStore Backend - Application Properties

# Application
spring.application.name=geststore-backend
server.port=8080
# Context path removido - se configura en los @RequestMapping de los controladores
# para que Swagger UI funcione correctamente

# MongoDB
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.root=INFO
logging.level.com.geststore=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Security
spring.security.filter.order=5

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.locale=es_ES

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator - Health Checks and Monitoring
management.endpoints.web.exposure.include=health,info,metrics,env,loggers
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoints.web.base-path=/actuator

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.webjars.prefix=/webjars
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
