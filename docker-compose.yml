services:
  # Base de datos MongoDB
  db:
    image: mongo:7.0
    container_name: geststore-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-geststore}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-geststore123}
      MONGO_INITDB_DATABASE: ${DB_NAME:-geststore_dev}
    ports:
      - "${DB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - geststore-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      timeout: 5s
      retries: 10
      interval: 10s

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geststore-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      SPRING_DATA_MONGODB_URI: mongodb://${DB_USER:-geststore}:${DB_PASSWORD:-geststore123}@db:27017/${DB_NAME:-geststore_dev}?authSource=admin
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - geststore-network
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      timeout: 5s
      retries: 5
      interval: 10s
      start_period: 60s

  # Frontend Angular con Nginx
  frontend:
    build:
      context: ./GestStore
      dockerfile: Dockerfile
    container_name: geststore-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - geststore-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      timeout: 3s
      retries: 3
      interval: 10s

  # Mongo Express - Herramienta de gestión de MongoDB (opcional, comentar si no se necesita)
  mongo-express:
    image: mongo-express:latest
    container_name: geststore-mongo-express
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    networks:
      - geststore-network
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USER:-geststore}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASSWORD:-geststore123}
      ME_CONFIG_MONGODB_URL: mongodb://${DB_USER:-geststore}:${DB_PASSWORD:-geststore123}@db:27017/
      ME_CONFIG_BASICAUTH: false

networks:
  geststore-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  backend_logs:
    driver: local